<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>GHOSTFIRE</title>
<style>
  :root {
    --accent: #ff5533;
    --accent2: #33ddff;
    --bg: #101418;
    --panel: rgba(16, 20, 24, 0.92);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: 'Segoe UI', system-ui, sans-serif; color: #fff;
    touch-action: none; overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
  input, textarea, select, [contenteditable="true"] { user-select: text; -webkit-user-select: text; touch-action: auto; }
  #game-canvas { position: fixed; inset: 0; display: block; touch-action: none; }
  #mobile-ui, #stick-zone, #look-zone, #hud { touch-action: none; }

  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 16px; background: var(--panel); z-index: 20; overflow-y: auto; padding: 20px 0; touch-action: pan-y; }
  /* центр при коротком контенте, скролл сверху при длинном */
  .screen > :first-child { margin-top: auto; }
  .screen > :last-child { margin-bottom: auto; }
  #screen-menu { background: linear-gradient(rgba(16,20,24,.30), rgba(16,20,24,.88)), url('assets/menu_bg.jpg') center / cover; }
  .hidden { display: none !important; }

  .logo { font-size: clamp(42px, 9vw, 84px); font-weight: 900; letter-spacing: 4px; color: var(--accent);
    text-shadow: 4px 4px 0 #000, 0 0 40px rgba(255,85,51,.5); font-style: italic; }
  .logo span { color: var(--accent2); }
  .subtitle { opacity: .7; margin-top: -12px; margin-bottom: 12px; }

  .btn { min-width: 240px; padding: 14px 28px; font-size: 20px; font-weight: 700; color: #fff;
    background: #232a33; border: 3px solid #3a4450; border-radius: 6px; cursor: pointer;
    text-transform: uppercase; letter-spacing: 1px; transition: transform .06s, border-color .1s; }
  .btn:hover { border-color: var(--accent); transform: translateY(-2px); }
  .btn.primary { background: var(--accent); border-color: #ff7755; }
  .btn.small { min-width: 140px; padding: 8px 16px; font-size: 15px; }
  .btn:disabled { opacity: .4; cursor: default; }

  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

  h2 { font-size: 28px; text-transform: uppercase; letter-spacing: 2px; }
  .map-card { width: 200px; padding: 14px; background: #232a33; border: 3px solid #3a4450; border-radius: 6px; cursor: pointer; text-align: center; }
  .map-thumb { width: 100%; height: 92px; object-fit: contain; image-rendering: pixelated; background: #12161c; border-radius: 4px; margin-bottom: 8px; }
  .map-card:hover, .map-card.selected { border-color: var(--accent2); }
  .map-card .map-name { font-weight: 700; font-size: 18px; }
  .map-card .map-desc { font-size: 13px; opacity: .7; margin-top: 6px; }

  .ghost-card { width: min(420px, 88vw); padding: 12px 18px; background: #232a33; border: 3px solid #3a4450; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .ghost-card:hover { border-color: var(--accent); }
  .ghost-card .gname { font-weight: 700; font-size: 18px; }
  .ghost-card .gdesc { font-size: 13px; opacity: .7; }
  .ghost-card .gdiff { color: var(--accent); font-weight: 900; font-size: 20px; }

  textarea#challenge-input { width: min(420px, 88vw); height: 90px; background: #181d23; color: #9fd; border: 2px solid #3a4450; border-radius: 6px; padding: 10px; font-family: monospace; font-size: 12px; resize: none; }

  .setting-row { display: flex; justify-content: space-between; align-items: center; width: min(420px, 88vw); padding: 10px 0; border-bottom: 1px solid #2a3038; }

  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #crosshair { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 22px; height: 22px; }
  #crosshair::before, #crosshair::after { content: ""; position: absolute; background: #fff; box-shadow: 0 0 3px #000; }
  #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
  #crosshair::after { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }
  #crosshair.charging::before, #crosshair.charging::after { background: var(--accent2); }

  #hp-bar { position: absolute; left: 20px; bottom: 20px; width: 220px; }
  #hp-fill { height: 22px; background: linear-gradient(90deg, #ff3322, #ff7744); border-radius: 4px; transition: width .15s; box-shadow: 0 0 8px rgba(255,60,30,.6); }
  #hp-bar .frame { border: 3px solid #fff3; border-radius: 6px; padding: 2px; background: #0008; }
  #hp-num { font-size: 26px; font-weight: 900; text-shadow: 2px 2px 0 #000; margin-bottom: 4px; }

  #weapon-label { position: absolute; right: 20px; bottom: 20px; text-align: right; font-size: 22px; font-weight: 900; text-transform: uppercase; text-shadow: 2px 2px 0 #000; }
  #score-mini { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); font-size: 26px; font-weight: 900; text-shadow: 2px 2px 0 #000; letter-spacing: 2px; background: #0006; padding: 4px 18px; border-radius: 8px; }
  #hitmarker { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%) rotate(45deg); width: 30px; height: 30px; opacity: 0; }
  #hitmarker::before, #hitmarker::after { content:""; position:absolute; background:#ff4433; }
  #hitmarker::before { left:50%; top:0; width:3px; height:100%; transform:translateX(-50%); }
  #hitmarker::after { top:50%; left:0; height:3px; width:100%; transform:translateY(-50%); }
  #hitmarker.pop { animation: hitpop .18s ease-out; }
  @keyframes hitpop { 0% { opacity:1; transform:translate(-50%,-50%) rotate(45deg) scale(1.4);} 100% { opacity:0; transform:translate(-50%,-50%) rotate(45deg) scale(.8);} }
  #damage-vignette { position: absolute; inset: 0; box-shadow: inset 0 0 120px rgba(255,0,0,.55); opacity: 0; transition: opacity .4s; }

  #countdown { position: absolute; left: 50%; top: 38%; transform: translate(-50%,-50%); font-size: 110px; font-weight: 900; color: var(--accent2); text-shadow: 5px 5px 0 #000; }
  #round-banner { position: absolute; left: 50%; top: 24%; transform: translateX(-50%); font-size: 40px; font-weight: 900; text-shadow: 3px 3px 0 #000; text-align: center; }
  #toast { position: fixed; bottom: 44px; left: 50%; transform: translateX(-50%); background: #232a33; border: 2px solid var(--accent2); border-radius: 8px; padding: 10px 22px; font-weight: 700; z-index: 60; opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 90vw; text-align: center; }
  #toast.show { opacity: 1; }
  .reward-box { width: min(340px, 86vw); background: #1a2028; border: 2px solid #2a3038; border-radius: 8px; padding: 10px 16px; }
  .reward-row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 15px; }
  .reward-row b { color: var(--accent2); }
  .reward-row.bonus span { color: #ffd75e; }
  .reward-row.total { border-top: 1px solid #2a3038; margin-top: 4px; padding-top: 7px; font-weight: 900; }
  #tut-box { position: absolute; top: 64px; left: 50%; transform: translateX(-50%); background: #1a2028ee; border: 2px solid var(--accent2); border-radius: 10px; padding: 12px 14px 12px 20px; font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 12px; pointer-events: auto; max-width: 92vw; }
  #tut-close { background: none; border: none; color: #fff8; font-size: 20px; cursor: pointer; padding: 2px 6px; }
  #tut-arrow { position: absolute; font-size: 44px; text-shadow: 2px 2px 0 #000; transform: translate(-50%, -100%); transition: left .1s linear, top .1s linear; }
  #preloader { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; transition: opacity .35s; }
  #preloader.done { opacity: 0; pointer-events: none; }
  #preloader-bar { width: min(320px, 70vw); height: 14px; background: #232a33; border: 2px solid #3a4450; border-radius: 8px; overflow: hidden; }
  #preloader-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .25s; }
  .bigscore { font-size: clamp(64px, 14vw, 120px); font-weight: 900; letter-spacing: 6px; text-shadow: 5px 5px 0 #000; }
  .bigscore .me { color: var(--accent2); } .bigscore .foe { color: var(--accent); }

  /* Mobile controls */
  #mobile-ui { position: fixed; inset: 0; z-index: 15; pointer-events: none; display: none; }
  body.is-touch #mobile-ui { display: block; }
  #stick-zone { position: absolute; left: 0; top: 0; width: 45%; height: 100%; pointer-events: auto; }
  #look-zone { position: absolute; right: 0; top: 0; width: 55%; height: 100%; pointer-events: auto; }
  #stick-base { position: absolute; width: 120px; height: 120px; border: 3px solid #fff5; border-radius: 50%; background: #0004; display: none; }
  #stick-knob { position: absolute; width: 54px; height: 54px; border-radius: 50%; background: #fff8; left: 33px; top: 33px; }
  .mbtn { position: absolute; border-radius: 50%; background: #0006; border: 3px solid #fff6; color: #fff; font-weight: 900; display: flex; align-items: center; justify-content: center; pointer-events: auto; user-select: none; touch-action: none; }
  .mbtn:active { background: var(--accent); }
  #btn-fire { right: 24px; bottom: 90px; width: 96px; height: 96px; font-size: 15px; border-color: var(--accent); }
  #btn-jump { right: 140px; bottom: 32px; width: 68px; height: 68px; font-size: 13px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/",
    "lz-string": "./vendor/lz-string.js"
  }
}
</script>
</head>
<body>
<!-- прелоадер: виден сразу, до загрузки модулей; прячет game.js после boot -->
<div id="preloader">
  <div class="logo">GHOST<span>FIRE</span></div>
  <div id="preloader-bar"><div id="preloader-fill"></div></div>
</div>
<canvas id="game-canvas"></canvas>
<script>function isTextField(t){return t instanceof Element&&t.closest('input,textarea,select,[contenteditable="true"]')}document.addEventListener('contextmenu',e=>{if(!isTextField(e.target))e.preventDefault()});document.addEventListener('selectstart',e=>{if(!isTextField(e.target))e.preventDefault()})</script>

<!-- HUD -->
<div id="hud" class="hidden">
  <div id="damage-vignette"></div>
  <div id="crosshair"></div>
  <div id="hitmarker"></div>
  <div id="hp-bar"><div id="hp-num">100</div><div class="frame"><div id="hp-fill" style="width:100%"></div></div></div>
  <div id="weapon-label"></div>
  <div id="score-mini">0 : 0</div>
  <div id="countdown" class="hidden"></div>
  <div id="round-banner" class="hidden"></div>
  <!-- туториал первого запуска -->
  <div id="tut-box" class="hidden"><span id="tut-text"></span><button id="tut-close">✕</button></div>
  <div id="tut-arrow" class="hidden">👇</div>
</div>

<!-- Mobile -->
<div id="mobile-ui">
  <div id="stick-zone"><div id="stick-base"><div id="stick-knob"></div></div></div>
  <div id="look-zone"></div>
  <div class="mbtn" id="btn-fire">FIRE</div>
  <div class="mbtn" id="btn-jump">JMP</div>
</div>

<!-- Screens (filled by ui.js) -->
<div id="screen-menu" class="screen"></div>
<div id="screen-maps" class="screen hidden"></div>
<div id="screen-ghosts" class="screen hidden"></div>
<div id="screen-challenge" class="screen hidden"></div>
<div id="screen-shop" class="screen hidden"></div>
<div id="screen-settings" class="screen hidden"></div>
<div id="screen-pause" class="screen hidden"></div>
<div id="screen-round" class="screen hidden"></div>
<div id="screen-match" class="screen hidden"></div>

<script type="module" src="js/game.js"></script>
</body>
</html>
